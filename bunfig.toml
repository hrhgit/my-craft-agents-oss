# Use the hoisted linker so transitive deps resolve at top-level node_modules.
# Vite + esbuild bundling expects this layout; bun's default isolated linker
# leaves only declared deps at the workspace root, which breaks renderer imports
# of packages pulled in transitively (i18next, @tiptap/*, pdfjs-dist, etc.).
# Note: the Windows build script (scripts/build/common.ts) was already using
# `bun install --linker=hoisted` for the same reason.
[install]
linker = "hoisted"

[test]
preload = ["./scripts/test-process-lifecycle.ts"]
pathIgnorePatterns = [
  "apps/electron/release/**",
  "output/**",
  # pi is an independent npm workspace whose tests are vitest-based and run
  # through `bun run pi:test` (cd pi && bash ./test.sh). Root `bun test`
  # must not discover them: bun executing vitest suites hangs on several
  # openai-*/stream tests, which made the full unit run time out.
  "pi/**",
  # Build and mortise-ui suites are integration/fixture tests with dedicated
  # commands. Keeping them out of the root unit discovery avoids running the
  # same expensive suites twice while preserving their explicit gates.
  "scripts/build/**",
  "scripts/mortise-ui/**",
]

extends: ./electron-builder.yml

appId: io.github.hrhgit.mortise.devhost
productName: Mortise Developer Host
copyright: Copyright © 2026 Mortise Contributors

# Isolated source builds share only immutable third-party dependency packages.
# Do not let electron-builder rewrite that dependency store.
npmRebuild: false

directories:
  output: release-devhost
  buildResources: dist/resources

# The Developer Host is later copied into the Developer Kit. It is not itself
# an installer containing a Developer Kit, so it uses the host-specific hook.
afterPack: dist/packaging-inputs/hooks/afterPack-devhost.cjs

win:
  icon: dist/resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "Mortise-Developer-Host-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # CLI-owned run cleanup removes disposable profiles without broad AppData deletion.
  deleteAppDataOnUninstall: false
